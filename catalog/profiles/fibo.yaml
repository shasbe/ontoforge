notes:
- 3,021 classes from 221 content modules / 130,273 triples. (The original hand analysis counted 286 files
  / 132,414 triples by also parsing the About*/Metadata* aggregators, which carry only owl:imports; the
  ingester excludes them.)
- 219 SEC Preferred* share classes collapsed into flags on FinancialInstrument (SUBCLASS_COLLAPSE).
- InstrumentType is the TAXONOMY_SIDECAR for the 12-level class tree.
- 'External imports NOT vendored: 1,193 to OMG Commons, 54 to LCC (IMPORT_RESOLVE).'
- Canvas positions are curated (domain-banded), not grid-generated.
- Timestamps are declared DATETIME; the TYPE_MAP rule negotiates them to STRING (ISO 8601) for targets
  whose Neo4jType enum lacks DATETIME.
