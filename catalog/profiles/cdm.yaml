notes:
- 'Source: 145 .rosetta files / 763 types / 280 enums (4,226 values) / 2,699 attributes.'
- 'Rosetta declares what OWL makes you infer: 0% anonymous constructs, single-parent inheritance to depth
  4, explicit (lo..hi) cardinality, and an explicit scalar-vs-complex split (899 scalar attributes ->
  properties, 1,800 complex -> relationships).'
- '`choice` types are named unions, so DISCRIMINATOR input is declared rather than recovered from anonymous
  owl:unionOf. 16 choices: Asset, Payout, Product, Observable, Transfer, Instrument, Index, InterestRateIndex,
  Underlier and others.'
- Choice membership is emitted as IS_<OPTION> relationships. In Rosetta an option can both extend a base
  type and belong to a choice (Cash extends AssetBase and is an Asset option), which is why 32 types legitimately
  have two parents.
- 'NOT represented: 1,290 func definitions and 615 conditions. CDM is machine-EXECUTABLE; a property graph
  holds its data shape, not its calculations. This is the single biggest caveat when presenting a CDM
  graph model.'
- TradeState.SUCCEEDS is a derived traversal edge, not a CDM attribute -- CDM threads lifecycle through
  BusinessEvent (before/after TradeState). It is included because the state chain is the query most people
  want.
- 'Licence differs from the rest of the catalog: Community Specification License 1.0, not MIT/Apache.
  See NOTICE.md before redistributing derived artifacts.'
