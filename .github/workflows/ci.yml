name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # The nine hand-built models are the specification: any rule or emitter
      # change that alters them fails here.
      - name: Golden-file regression
        run: PYTHONPATH=packages/core python tests/test_golden.py
      - name: Validate the committed catalog bundle
        run: |
          PYTHONPATH=packages/core python -m ontoforge.cli \
            validate apps/web/public/catalog/*/model.json
      - name: Catalog bundle is in sync with the profiles
        run: |
          PYTHONPATH=packages/core python -m ontoforge.cli export --out /tmp/check
          for f in /tmp/check/*/model.json; do
            std=$(basename $(dirname "$f"))
            diff -q "$f" "apps/web/public/catalog/$std/model.json" \
              || { echo "::error::$std is stale -- run 'ontoforge export' and commit"; exit 1; }
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx tsc -b
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
